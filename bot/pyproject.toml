[project]
name = "qr-reviews-bot"
version = "0.1.0"
description = "QR Reviews Telegram bot: links Telegram chats to dashboard accounts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

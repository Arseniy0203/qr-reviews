# Dev reverse proxy: http://localhost:8080
#   /api/  -> FastAPI
#   /r/    -> FastAPI (public review form)
#   /      -> Vite dev server (with HMR websocket)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  # Docker's DNS; variables in proxy_pass force re-resolution, so recreated
  # containers (new IPs) do not cause 502 until nginx restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;
  set $frontend http://frontend:5173;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite (not append) so clients cannot spoof their IP for rate limits / antifraud.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass $backend;
  }

  location /r/ {
    proxy_pass $backend;
  }

  # Internal endpoints are reachable only inside the docker network.
  location /internal/ {
    return 404;
  }

  location / {
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

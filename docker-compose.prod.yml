# Production: docker compose -f docker-compose.prod.yml up -d --build
# First run on a new server: sh infra/scripts/init-letsencrypt.sh (see README).
name: qr-reviews-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0

x-backend: &backend
  build:
    context: ./backend
    target: prod
  image: qr-reviews-backend:prod
  env_file: .env
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: [*backend, *logging]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: [*backend, *logging]
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ./bot
      target: prod
    env_file: .env
    restart: unless-stopped
    depends_on:
      - backend
    <<: *logging

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      - backend
    <<: *logging

  certbot:
    image: certbot/certbot:v4.1.1
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Tries renewal twice a day; certbot only renews certs expiring within 30 days.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $!; done"]
    restart: unless-stopped
    <<: *logging

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  certbot-www:
